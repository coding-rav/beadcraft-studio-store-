# Minimal Supabase CLI config for local development (`supabase start`) and deploys.
project_id = "beadcraft-studio"

[api]
enabled = true

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/login", "http://localhost:5173/reset-password"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false   # local only; set email-confirmation behaviour for production in the dashboard

[functions.create-razorpay-order]
verify_jwt = true
[functions.verify-razorpay-payment]
verify_jwt = true
[functions.razorpay-webhook]
verify_jwt = false             # Razorpay cannot send a Supabase JWT; auth is the HMAC signature

[functions.generate-invoice]
verify_jwt = true
[functions.refund-razorpay-payment]
verify_jwt = true
[functions.reconcile-payments]
verify_jwt = true
[functions.process-notifications]
verify_jwt = true
